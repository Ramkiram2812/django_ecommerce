{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}NovaCart{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{% url 'home' %}">NovaCart</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">☰</button>
    <div class="collapse navbar-collapse" id="nav">
      <form class="d-flex mx-lg-auto my-2 my-lg-0 searchbox" action="{% url 'product_list' %}">
        <input class="form-control" name="q" value="{{ search|default:'' }}" placeholder="Search products...">
        <button class="btn btn-light ms-2">Search</button>
      </form>
      <ul class="navbar-nav ms-lg-3">
        <li class="nav-item"><a class="nav-link" href="{% url 'product_list' %}">Shop</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'cart' %}">Cart 🛒 <span class="badge text-bg-primary">{{ cart_count }}</span></a></li>
      </ul>
    </div>
  </div>
</nav>
{% if messages %}
<div class="container mt-3">{% for message in messages %}<div class="alert alert-{{ message.tags|default:'info' }}">{{ message }}</div>{% endfor %}</div>
{% endif %}
{% block content %}{% endblock %}
<footer class="mt-5 py-4 bg-dark text-white"><div class="container text-center">© 2026 NovaCart · Django E-commerce Demo</div></footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
