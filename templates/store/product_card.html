{% load static %}
<div class="col-6 col-md-4 col-lg-3"><div class="card product-card h-100">
 <a href="{% url 'product_detail' product.slug %}"><img src="{% static product.image %}" class="card-img-top product-img"></a>
 <div class="card-body d-flex flex-column"><small class="text-muted">{{ product.category.name }}</small><h5 class="card-title mt-1">{{ product.name }}</h5>
 <div class="mt-auto"><span class="fw-bold">₹{{ product.price }}</span>{% if product.old_price %}<del class="text-muted ms-2">₹{{ product.old_price }}</del>{% endif %}
 <form method="post" action="{% url 'add_to_cart' product.id %}" class="mt-3">{% csrf_token %}<input type="hidden" name="next" value="cart"><button class="btn btn-dark w-100">Add to cart</button></form></div></div>
</div></div>
