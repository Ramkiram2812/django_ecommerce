{% extends "base.html" %}
{% block title %}Checkout | NovaCart{% endblock %}
{% block content %}<div class="container py-5"><div class="row g-5"><div class="col-lg-7"><h1>Checkout</h1><form method="post" class="mt-4">{% csrf_token %}<div class="row g-3">
<div class="col-12"><label class="form-label">Full name</label><input required class="form-control" name="full_name"></div>
<div class="col-md-6"><label class="form-label">Email</label><input required type="email" class="form-control" name="email"></div>
<div class="col-md-6"><label class="form-label">Phone</label><input required class="form-control" name="phone"></div>
<div class="col-12"><label class="form-label">Address</label><textarea required class="form-control" name="address" rows="3"></textarea></div>
<div class="col-md-7"><label class="form-label">City</label><input required class="form-control" name="city"></div>
<div class="col-md-5"><label class="form-label">PIN code</label><input required class="form-control" name="pincode"></div>
<div class="col-12"><button class="btn btn-dark btn-lg w-100">Place order</button></div></div></form></div>
<div class="col-lg-5"><div class="card p-4"><h4>Order summary</h4>{% for item in items %}<div class="d-flex justify-content-between py-2"><span>{{ item.product.name }} × {{ item.quantity }}</span><span>₹{{ item.subtotal }}</span></div>{% endfor %}<hr><div class="d-flex justify-content-between"><strong>Total</strong><strong>₹{{ total }}</strong></div></div></div></div></div>{% endblock %}
