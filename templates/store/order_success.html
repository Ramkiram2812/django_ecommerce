{% extends "base.html" %}
{% block title %}Order confirmed | NovaCart{% endblock %}
{% block content %}<div class="container py-5 text-center"><div class="success-icon">✓</div><h1 class="mt-3">Order confirmed!</h1><p class="lead">Thanks, {{ order.full_name }}. Your order #{{ order.id }} has been placed.</p><p>Total: <strong>₹{{ order.total }}</strong></p><a href="{% url 'product_list' %}" class="btn btn-dark">Continue shopping</a></div>{% endblock %}
